basePath: /
definitions:
  gemini.AttractionInfo:
    properties:
      confidence:
        type: number
      description:
        type: string
      historical_info:
        type: string
      interesting_facts:
        items:
          type: string
        type: array
      location:
        $ref: '#/definitions/gemini.LocationInfo'
      name:
        type: string
      significance:
        type: string
    type: object
  gemini.LocationInfo:
    properties:
      city:
        type: string
      country:
        type: string
      region:
        type: string
    type: object
  handlers.DatabaseHealthStatus:
    description: Database connection and health status
    properties:
      connections:
        example: 2
        type: integer
      max_connections:
        example: 10
        type: integer
      status:
        example: healthy
        type: string
    type: object
  handlers.ErrorResponse:
    properties:
      code:
        type: integer
      error:
        type: string
      message:
        type: string
    type: object
  handlers.HealthResponse:
    description: Health check response with system and database status
    properties:
      database:
        $ref: '#/definitions/handlers.DatabaseHealthStatus'
      status:
        example: healthy
        type: string
      system:
        $ref: '#/definitions/handlers.SystemHealthStatus'
      version:
        example: 1.0.0
        type: string
    type: object
  handlers.SessionSummary:
    properties:
      confidence_score:
        type: number
      created_at:
        type: string
      error_message:
        type: string
      id:
        type: string
      image_hash:
        type: string
      image_path:
        type: string
      primary_attraction:
        type: string
      processing_completed_at:
        type: string
      processing_started_at:
        type: string
      status:
        type: string
    type: object
  handlers.SystemHealthStatus:
    description: System uptime and timestamp information
    properties:
      timestamp:
        example: "2023-12-01T12:00:00Z"
        type: string
      uptime:
        example: 24h30m45s
        type: string
    type: object
  recognition.ErrorDetail:
    properties:
      code:
        type: string
      details:
        type: string
      message:
        type: string
    type: object
  recognition.RecognitionResponse:
    properties:
      message:
        type: string
      session_id:
        type: string
      status:
        type: string
    type: object
  recognition.RecognitionResult:
    properties:
      attraction_info:
        $ref: '#/definitions/gemini.AttractionInfo'
      error:
        $ref: '#/definitions/recognition.ErrorDetail'
      processing_time_ms:
        type: integer
      session_id:
        type: string
      status:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is the Nekibuki backend API server for tourist attraction recognition
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Nekibuki API
  version: 1.0.0
paths:
  /api/health:
    get:
      consumes:
      - application/json
      description: Get the health status of the API and its dependencies
      produces:
      - application/json
      responses:
        "200":
          description: Healthy system
          schema:
            $ref: '#/definitions/handlers.HealthResponse'
        "503":
          description: System unhealthy
          schema:
            $ref: '#/definitions/handlers.HealthResponse'
      summary: Health Check
      tags:
      - Health
  /api/recognition/result/{session_id}:
    get:
      description: Get the recognition result for a specific session ID
      parameters:
      - description: Session ID
        in: path
        name: session_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/recognition.RecognitionResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Get recognition result
      tags:
      - recognition
  /api/recognition/sessions:
    get:
      description: Get a list of recent recognition sessions for debugging purposes
      parameters:
      - default: 10
        description: Maximum number of sessions to return
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.SessionSummary'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Get recent sessions
      tags:
      - recognition
  /api/recognition/upload:
    post:
      consumes:
      - multipart/form-data
      description: Upload a photo to identify tourist attractions and landmarks
      parameters:
      - description: Photo to analyze
        in: formData
        name: photo
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/recognition.RecognitionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Upload photo for recognition
      tags:
      - recognition
schemes:
- http
- https
swagger: "2.0"
tags:
- description: Health check operations
  name: Health
- description: Photo recognition and tourist attraction identification
  name: Recognition
