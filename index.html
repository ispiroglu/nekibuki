<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <script src="/theme-init.js"></script>
    <!--
      Paper and dark paper from DESIGN.md. The pair follows the OS by default;
      AppearanceSync silences both and pins one value when the traveller picks
      light or dark in the app.
    -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#faf9f5"
      data-theme-color="light"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#1f1e1d"
      data-theme-color="dark"
    />
    <meta
      name="description"
      content="Nekibuki is a pocket guide for travellers: photograph a place and understand it."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nekibuki" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <link rel="mask-icon" href="/mask-icon.svg" color="#0f5f57" />
    <title>Nekibuki — A guide in your pocket</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
