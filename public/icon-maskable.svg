<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Maskable icon: petrol field, petrol-foreground marks.
    The mark is drawn at scale 17 around the centre, so it occupies roughly the
    middle 80% circle (safe zone) and survives every platform mask.
  -->
  <rect width="1024" height="1024" fill="#0f5f57" />
  <g transform="translate(512 512) scale(17) translate(-16 -16)">
    <g stroke="#f2fbf8" stroke-width="2.6" stroke-linecap="round" fill="none">
      <path d="M16 4A12 12 0 0 1 23.71 6.81" />
      <path d="M16 4A12 12 0 0 1 23.71 6.81" transform="rotate(60 16 16)" />
      <path d="M16 4A12 12 0 0 1 23.71 6.81" transform="rotate(120 16 16)" />
      <path d="M16 4A12 12 0 0 1 23.71 6.81" transform="rotate(180 16 16)" />
      <path d="M16 4A12 12 0 0 1 23.71 6.81" transform="rotate(240 16 16)" />
      <path d="M16 4A12 12 0 0 1 23.71 6.81" transform="rotate(300 16 16)" />
    </g>
    <circle cx="16" cy="16" r="3.4" fill="#f2fbf8" />
  </g>
</svg>
